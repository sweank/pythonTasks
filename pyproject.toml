[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shikaku-solver"
version = "1.0.0"
description = "Console Shikaku puzzle solver with tests and CI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Student project template" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
shikaku = "shikaku.cli:main"

[tool.pytest.ini_options]
addopts = "--cov=shikaku --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.setuptools]
packages = ["shikaku"]
